  <path d="M60 7.5 L108.5 16.5 V61 C108.5 94.5 87 117 60 131.5 C33 117 11.5 94.5 11.5 61 V16.5 Z" fill="url(#field)"/>
  <path d="M60 13 L103.5 21 V61 C103.5 91 84 111.5 60 125 C36 111.5 16.5 91 16.5 61 V21 Z" fill="none" stroke="#d9c38a" stroke-opacity=".5" stroke-width=".8"/>
