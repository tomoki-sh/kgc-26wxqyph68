  <!-- 名札とモノグラム -->
  <rect x="24.5" y="58.5" width="71" height="31" rx="4" fill="url(#plate)" stroke="#d6b86a" stroke-width="1.1"/>
  <rect x="27.3" y="61.3" width="65.4" height="25.4" rx="2.6" fill="none" stroke="#d6b86a" stroke-opacity=".45" stroke-width=".6"/>
  <text x="60.4" y="83.2" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'Hiragino Mincho ProN', serif" font-size="25.5" font-weight="700" letter-spacing="1.6" fill="#f3ead2">KGC</text>
  <!-- 創立年 -->
  <text x="60" y="117.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="8.2" letter-spacing="1.4" fill="#d6b86a">EST. 2026</text>
