  <g fill="#d6b86a">
    <path d="M60 19 Q58 25.5 51.5 30.6 Q56 30 60 31.2 Q64 30 68.5 30.6 Q62 25.5 60 19 Z"/>
    <path d="M60 25.6 Q56.4 33.4 46 38.6 Q53.5 37.6 60 39 Q66.5 37.6 74 38.6 Q63.6 33.4 60 25.6 Z"/>
    <path d="M60 32.4 Q54.6 41.6 40.5 47 Q51 45.6 60 47.4 Q69 45.6 79.5 47 Q65.4 41.6 60 32.4 Z"/>
    <rect x="58.3" y="46" width="3.4" height="6.6" rx="1"/>
