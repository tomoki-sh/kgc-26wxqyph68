<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" role="img" aria-label="KGC">
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e4b39"/>
      <stop offset="1" stop-color="#0f281e"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ead293"/>
      <stop offset=".45" stop-color="#c29d48"/>
      <stop offset="1" stop-color="#8d6a24"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#173f2f"/>
      <stop offset="1" stop-color="#0c2219"/>
