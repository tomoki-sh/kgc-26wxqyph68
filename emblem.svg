    <path d="M33 46 L84 101" stroke="#efe6cc" stroke-width="2.2"/>
    <path d="M87 46 L36 101" stroke="#efe6cc" stroke-width="2.2"/>
    <path d="M31.5 44.4 L36.5 49.8" stroke="#d6b86a" stroke-width="3.6"/>
    <path d="M88.5 44.4 L83.5 49.8" stroke="#d6b86a" stroke-width="3.6"/>
  </g>
  <g fill="#efe6cc">
    <path d="M82.2 99.6 L92.6 103.2 Q95 104.2 94 106.6 L93.6 107.4 Q92.8 108.6 90.8 108.2 L82.6 105.8 Q80.6 105 81 102.8 Z"/>
    <path d="M37.8 99.6 L27.4 103.2 Q25 104.2 26 106.6 L26.4 107.4 Q27.2 108.6 29.2 108.2 L37.4 105.8 Q39.4 105 39 102.8 Z"/>
  </g>
